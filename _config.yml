# MLTF Gateway Tutorial Configuration

title: "MLflow MLTF Gateway Tutorial"
description: "Learn to submit ML training jobs to HPC clusters using the MLflow MLTF Gateway"
slug: "mltf-gateway-tutorial"

# Contact
email: "mltf@accre.vanderbilt.edu"
repository: "PerilousApricot/2026-12-01-mltf"

# Self-paced tutorial settings
carpentry: "custom"
curriculum: "mltf-gateway"
flavor: "python"
kind: "lesson"
pilot: true
pre_survey: ""
post_survey: ""
start_time: 0

# Collections
collections:
  extras:
    output: true
    permalink: /:path/index.html

# Defaults
defaults:
  - values:
      root: .
      layout: page

# Exclude build artifacts
exclude:
  - Makefile
  - bin/
  - .Rproj.user/
  - .vendor/
  - vendor/
  - .docker-vendor/

# Syntax highlighting
highlighter: rouge

# No external theme
theme: null

# Deployment URL
url: "https://perilousapricot.github.io/2026-12-01-mltf"
